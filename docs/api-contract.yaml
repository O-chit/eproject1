    CollectionItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Di sản Dệt may Việt Nam
        slug:
          type: string
          example: di-san-det-may-viet-nam
        description:
          type: string
          example: Tuyển tập các kỹ thuật dệt lụa và thổ cẩm trứ danh.
        bannerUrl:
          type: string
          example: https://images.craftroots.vn/banner_textile.jpg

    SeasonalCollectionSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Sắc Lam Mát Lành – Tuyển Tập Mùa Hè 2026
        slug:
          type: string
          example: mua-he-2026-mat-lanh
        seasonCode:
          type: string
          enum: [spring, summer, autumn, winter]
          example: summer
        year:
          type: integer
          example: 2026
        archiveCode:
          type: string
          example: CR-ARCH-SUMMER-26
        colorTone:
          type: string
          example: '#0ea5e9'
        bannerUrl:
          type: string
          example: https://images.craftroots.vn/summer_banner.jpg

    SeasonalCollectionDetail:
      allOf:
        - $ref: '#/components/schemas/SeasonalCollectionSummary'
        - type: object
          properties:
            themeConcept:
              type: string
              example: Không gian văn hóa mùa hè thanh bình với những vật dụng thủ công làm mát tâm hồn.
            philosophyQuote:
              type: string
              example: Cái mát của đất nung và hương cỏ lau là bài thuốc an tĩnh ngày hạ oi bức.
            startDate:
              type: string
              format: date
              example: 2026-05-01
            endDate:
              type: string
              format: date
              example: 2026-08-31
            heroCraft:
              $ref: '#/components/schemas/CraftSummary'
            curatedCrafts:
              type: array
              items:
                type: object
                properties:
                  craft:
                    $ref: '#/components/schemas/CraftSummary'
                  curatorNote:
                    type: string
                    example: Tác phẩm mang sắc men lam thanh dịu, gợi nhắc tiếng gió hiên nhà mùa hạ.
                  highlightBadge:
                    type: string
                    example: Tiêu điểm ngày hè
                  isHero:
                    type: boolean
                    example: false

    FieldNoteItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Ký Họa Lò Bầu Bát Tràng
        body:
          type: string
          example: Dưới ánh lửa bập bùng nung củi ba ngày ba đêm của lò bầu cổ...
        coordinates:
          type: string
          example: 20.9782° N, 105.9103° E
        imageUrl:
          type: string
          example: https://images.craftroots.vn/fieldnotes/lo-bau.jpg
        metrics:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                example: Nhiệt độ lò
              value:
                type: string
                example: 1300°C

    GalleryImage:
      type: object
      properties:
        id:
          type: integer
          example: 1
        craftId:
          type: integer
          example: 1
        craftName:
          type: string
          example: Bình gốm men lam Bát Tràng
        url:
          type: string
          example: https://images.craftroots.vn/gallery/bat_trang_1.jpg
        altText:
          type: string
          example: Bàn tay nghệ nhân đang chuốt cốt gốm trên bàn xoay
        caption:
          type: string
          example: Nghệ thuật nhào nặn đất sét thủ công truyền thống

    FavouritesSyncRequest:
      type: object
      required:
        - craftIds
      properties:
        craftIds:
          type: array
          items:
            type: integer
          example: [1, 4, 7]

    FavouritesSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            craftIds:
              type: array
              items:
                type: integer
              example: [1, 5, 8]
            totalCount:
              type: integer
              example: 3

    VisitBookingRequest:
      type: object
      required:
        - artisanId
        - fullName
        - phone
        - visitDate
        - timeSlot
        - purpose
      properties:
        artisanId:
          type: integer
          example: 1
        fullName:
          type: string
          example: Lê Hoàng Nam
        phone:
          type: string
          example: '0912345678'
        email:
          type: string
          format: email
          example: nam.le@example.com
        visitDate:
          type: string
          format: date
          example: 2026-10-25
        timeSlot:
          type: string
          enum: [morning, afternoon]
          example: morning
        guestCount:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          example: 2
        purpose:
          type: string
          example: Đàm đạo trà và chiêm ngưỡng cốt gốm men lam độc bản
        note:
          type: string
          example: Đi cùng gia đình muốn tìm hiểu kỹ nghệ vuốt tay truyền thống

    VisitBookingResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Đăng ký lịch hẹn thành công. Ban biên tập sẽ liên hệ xác nhận trong 24h.
        data:
          $ref: '#/components/schemas/VisitBookingItem'

    VisitBookingItem:
      type: object
      properties:
        id:
          type: integer
          example: 101
        artisanId:
          type: integer
          example: 1
        artisanName:
          type: string
          example: Nguyễn Văn Bình
        visitDate:
          type: string
          format: date
          example: 2026-10-25
        timeSlot:
          type: string
          example: morning
        guestCount:
          type: integer
          example: 2
        purpose:
          type: string
          example: Đàm đạo trà và chiêm ngưỡng cốt gốm
        status:
          type: string
          enum: [pending, confirmed, cancelled]
          example: pending
        createdAt:
          type: string
          format: date-time

    NewsletterRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: reader@craftroots.vn

    ContactRequest:
      type: object
      required:
        - fullName
        - email
        - message
      properties:
        fullName:
          type: string
          example: Lê Hoàng Nam
        email:
          type: string
          format: email
          example: nam.le@example.com
        phone:
          type: string
          example: '0912345678'
        topic:
          type: string
          enum: [curation, visit, heritage, other]
          default: other
          example: curation
        subject:
          type: string
          example: Tìm hiểu về làng gốm Bát Tràng
        message:
          type: string
          minLength: 10
          example: Tôi muốn liên hệ để tham quan và đặt làm sản phẩm riêng.
