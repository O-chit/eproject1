openapi: 3.0.3
info:
  title: CraftRoots REST API Specification
  description: >-
    Đặc tả giao diện lập trình ứng dụng RESTful API cho cổng thông tin khám phá
    nghề thủ công truyền thống CraftRoots (Dự án eProject - Aptech).
    Phiên bản nâng cấp v1.1.0 tích hợp hoàn chỉnh 9 bản thiết kế giao diện Stitch,
    mở rộng 22 bảng CSDL, hỗ trợ đặt lịch thăm xưởng, bản tin di sản và tìm kiếm đa diện.
  version: 1.1.0
  contact:
    name: CraftRoots Engineering Team
    email: support@craftroots.vn
servers:
  - url: http://localhost:5000/api
    description: Máy chủ phát triển cục bộ (Local Development)
  - url: https://api.craftroots.vn/api
    description: Máy chủ sản xuất (Production Server)

tags:
  - name: Home
    description: Dữ liệu tổng hợp trang chủ (spotlight craft, tác phẩm & nghệ nhân tiêu biểu, ký họa điền dã, chỉ số di sản)
  - name: System
    description: Thống kê số lượng động toàn hệ thống và giám sát API
  - name: Search
    description: Tìm kiếm toàn diện đa thực thể (tác phẩm, nghệ nhân, làng nghề)
  - name: Auth
    description: Xác thực người dùng, đăng ký, đăng nhập, hồ sơ cá nhân và bảo mật JWT
  - name: Crafts
    description: Tra cứu, tìm kiếm, lọc đa diện và xem chi tiết sản phẩm thủ công truyền thống
  - name: Artisans
    description: Hồ sơ nghệ nhân, niên biểu mốc son sự nghiệp và quy chuẩn tiếp đón thăm xưởng
  - name: Regions
    description: Khám phá bản đồ 6 vùng văn hóa, danh sách làng nghề và sản phẩm theo vùng miền
  - name: Bookings
    description: Đăng ký và quản lý phiếu hẹn thăm xưởng tiếp đón của nghệ nhân
  - name: Newsletter
    description: Đăng ký nhận bản tin di sản làng nghề hàng tháng
  - name: Metadata
    description: Dữ liệu danh mục, làng nghề, chất liệu, kỹ thuật phục vụ bộ lọc đa chiều
  - name: Collections
    description: Bộ sưu tập chuyên đề nổi bật
  - name: Seasonal Collections
    description: Bộ sưu tập theo mùa (Xuân, Hạ, Thu, Đông), triết lý giám tuyển và tác phẩm tiêu điểm
  - name: Gallery
    description: Thư viện ảnh tương tác Lightbox
  - name: Favourites
    description: Quản lý danh sách sản phẩm yêu thích và cơ chế đồng bộ lưỡng thể (Hybrid Sync)
  - name: Contact
    description: Tiếp nhận ý kiến đóng góp, đề xuất hợp tác giám tuyển từ khách truy cập
  - name: Admin Management (Optional)
    description: >-
      [Mục 6.3 Tuỳ chọn - Làm sau cùng, chưa có giao diện]
      Hệ thống API CRUD quản trị dữ liệu di sản dành riêng cho vai trò editor và admin qua middleware authorize('editor', 'admin').
      Chỉ triển khai sau khi hoàn tất giai đoạn 1–6 và toàn bộ kiểm thử test xanh.

paths:
  # ==========================================
  # HOME & SYSTEM ENDPOINTS
  # ==========================================
  /home:
    get:
      tags:
        - Home
      summary: Dữ liệu tổng hợp hiển thị trang chủ CraftRoots
      description: Đóng gói toàn bộ thông tin trang chủ trong một lệnh gọi tối ưu, bao gồm Spotlight Hero Craft (CR-BT-2025-08MR), chỉ số thống kê động, tác phẩm tiêu biểu, nghệ nhân hàng đầu, bộ sưu tập mùa mới nhất và ký họa điền dã thực địa.
      responses:
        '200':
          description: Tải dữ liệu trang chủ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'

  /stats:
    get:
      tags:
        - System
      summary: Thống kê số lượng động toàn hệ thống
      description: Trả về số lượng tổng hợp tác phẩm, nghệ nhân, làng nghề và di sản quốc gia.
      responses:
        '200':
          description: Thống kê thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'

  # ==========================================
  # SEARCH ENDPOINTS
  # ==========================================
  /search:
    get:
      tags:
        - Search
      summary: Tìm kiếm toàn diện đa thực thể
      description: Tìm kiếm đồng thời tác phẩm (crafts), nghệ nhân (artisans) và làng nghề (villages) bằng từ khóa.
      parameters:
        - name: q
          in: query
          required: true
          description: Từ khóa tìm kiếm
          schema:
            type: string
            example: Bát Tràng
        - name: type
          in: query
          description: Phạm vi thực thể cần tìm
          schema:
            type: string
            enum: [all, crafts, artisans, villages]
            default: all
        - name: limit
          in: query
          description: Số kết quả tối đa cho từng nhóm thực thể
          schema:
            type: integer
            default: 6
      responses:
        '200':
          description: Kết quả tìm kiếm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  # ==========================================
  # AUTHENTICATION ENDPOINTS
  # ==========================================
  /auth/register:
    post:
      tags:
        - Auth
      summary: Đăng ký tài khoản người dùng mới
      description: Tạo tài khoản mới, mật khẩu được băm tự động bằng bcrypt trước khi lưu vào CSDL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công, trả về token truy cập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '409':
          description: Email đã tồn tại trong hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập vào hệ thống
      description: Xác thực email và mật khẩu, trả về JWT Token và hồ sơ người dùng.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Sai email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Lấy thông tin tài khoản người dùng hiện tại
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/401Error'

  /auth/profile:
    put:
      tags:
        - Auth
      summary: Cập nhật thông tin hồ sơ người dùng
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'

  /auth/change-password:
    put:
      tags:
        - Auth
      summary: Đổi mật khẩu tài khoản
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'

  # ==========================================
  # CRAFTS ENDPOINTS
  # ==========================================
  /crafts:
    get:
      tags:
        - Crafts
      summary: Danh sách sản phẩm kèm tìm kiếm và bộ lọc đa diện
      description: Hỗ trợ tìm kiếm từ khóa, phân loại theo vùng, danh mục, làng nghề, chất liệu, kỹ thuật, danh sách ID yêu thích, phân trang và sắp xếp theo giá hoặc độ phổ biến.
      parameters:
        - name: q
          in: query
          description: Từ khóa tìm kiếm Full-Text Search (tên, bối cảnh văn hóa)
          schema:
            type: string
            example: gốm Bát Tràng
        - name: region
          in: query
          description: Lọc theo ID hoặc code vùng miền
          schema:
            type: string
            example: dong-bang-bac-bo
        - name: category
          in: query
          description: Lọc theo ID hoặc slug danh mục nghề
          schema:
            type: string
            example: gom-su
        - name: village
          in: query
          description: Lọc theo ID hoặc slug làng nghề truyền thống
          schema:
            type: string
            example: bat-trang
        - name: material
          in: query
          description: Lọc theo ID chất liệu
          schema:
            type: integer
            example: 1
        - name: technique
          in: query
          description: Lọc theo ID kỹ thuật chế tác
          schema:
            type: integer
            example: 2
        - name: ids
          in: query
          description: Danh sách ID sản phẩm cách nhau bởi dấu phẩy (phục vụ lấy nhanh danh sách yêu thích)
          schema:
            type: string
            example: '1,4,7'
        - name: sort
          in: query
          description: Tiêu chí sắp xếp kết quả
          schema:
            type: string
            enum: [latest, views, name_asc, name_desc, price_asc, price_desc]
            default: latest
        - name: page
          in: query
          description: Trang hiện tại
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Số bản ghi trên mỗi trang
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: Trả về danh sách sản phẩm, siêu dữ liệu phân trang và facets thống kê
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CraftSummary'
                  facets:
                    $ref: '#/components/schemas/CraftFacets'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Crafts
        - Admin Management (Optional)
      summary: "[Admin/Editor] Tạo mới tác phẩm thủ công"
      description: >-
        > ⚠️ **Mục 6.3 Tuỳ chọn (chưa có giao diện, làm sau cùng):** Tạo mới tác phẩm trong CSDL, thiết lập liên kết chất liệu, kỹ pháp và nghệ nhân đồng chế tác (N-N).
        Yêu cầu Bearer Token với vai trò `editor` hoặc `admin`. Chỉ thực hiện sau khi giai đoạn 1–6 xong và test xanh.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCraftRequest'
      responses:
        '201':
          description: Tạo tác phẩm thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Tạo mới tác phẩm thủ công thành công
                  data:
                    $ref: '#/components/schemas/CraftDetail'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'

  /crafts/{id}:
    get:
      tags:
        - Crafts
      summary: Xem chi tiết sản phẩm thủ công
      description: Trả về đầy đủ thông số kích thước, quy trình chế tác, thư viện ảnh gallery, kỹ thuật, chất liệu và danh sách nghệ nhân đồng sáng tạo (N-N).
      parameters:
        - name: id
          in: path
          required: true
          description: "ID số, slug hoặc mã REF của sản phẩm (Ví dụ: 1 hoặc CR-BT-2025-08MR)"
          schema:
            type: string
            example: CR-BT-2025-08MR
      responses:
        '200':
          description: Chi tiết sản phẩm hoàn chỉnh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CraftDetail'
        '404':
          $ref: '#/components/responses/404Error'

    put:
      tags:
        - Crafts
        - Admin Management (Optional)
      summary: "[Admin/Editor] Cập nhật thông tin tác phẩm thủ công"
      description: >-
        > ⚠️ **Mục 6.3 Tuỳ chọn (chưa có giao diện, làm sau cùng):** Cập nhật thuộc tính tác phẩm, giá VND, quy trình chế tác và thông số kỹ thuật.
        Yêu cầu Bearer Token với vai trò `editor` hoặc `admin`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID số hoặc mã SKU của tác phẩm
          schema:
            type: string
            example: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCraftRequest'
      responses:
        '200':
          description: Cập nhật tác phẩm thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cập nhật tác phẩm thành công
                  data:
                    $ref: '#/components/schemas/CraftDetail'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'

    delete:
      tags:
        - Crafts
        - Admin Management (Optional)
      summary: "[Admin Only] Xóa tác phẩm thủ công"
      description: >-
        > ⚠️ **Mục 6.3 Tuỳ chọn (chưa có giao diện, làm sau cùng):** Xóa tác phẩm khỏi hệ thống.
        Chỉ dành cho vai trò `admin`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID số của tác phẩm cần xóa
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'

  /crafts/{id}/related:
    get:
      tags:
        - Crafts
      summary: Lấy danh sách sản phẩm liên quan
      description: Gợi ý các tác phẩm có cùng nghệ nhân, cùng danh mục hoặc cùng vùng miền văn hóa.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: '1'
        - name: by
          in: query
          description: Tiêu chí gợi ý tác phẩm liên quan
          schema:
            type: string
            enum: [artisan, category, region]
            default: category
        - name: limit
          in: query
          schema:
            type: integer
            default: 4
      responses:
        '200':
          description: Danh sách sản phẩm liên quan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CraftSummary'

  # ==========================================
  # ARTISANS ENDPOINTS
  # ==========================================
  /artisans:
    get:
      tags:
        - Artisans
      summary: Lấy danh sách nghệ nhân & bậc thầy chế tác
      description: Hỗ trợ phân trang, lọc theo vùng miền, làng nghề và danh mục sở trường.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
        - name: category
          in: query
          description: Lọc theo slug/id danh mục nghề
          schema:
            type: string
            example: gom-su
        - name: village
          in: query
          description: Lọc theo slug/id làng nghề
          schema:
            type: string
            example: bat-trang
        - name: region
          in: query
          description: Lọc theo code/id vùng miền
          schema:
            type: string
            example: dong-bang-bac-bo
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtisanProfile'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Artisans
        - Admin Management (Optional)
      summary: "[Admin/Editor] Thêm mới hồ sơ nghệ nhân"
      description: >-
        > ⚠️ **Mục 6.3 Tuỳ chọn (chưa có giao diện, làm sau cùng):** Thêm mới hồ sơ nghệ nhân, niên biểu, quy chuẩn đón tiếp và xưởng chế tác.
        Yêu cầu Bearer Token với vai trò `editor` hoặc `admin`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArtisanRequest'
      responses:
        '201':
          description: Thêm mới nghệ nhân thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Thêm hồ sơ nghệ nhân thành công
                  data:
                    $ref: '#/components/schemas/ArtisanDetail'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'

  /artisans/{id}:
    get:
      tags:
        - Artisans
      summary: Xem hồ sơ chi tiết nghệ nhân
      description: Trả về tiểu sử, triết lý, niên biểu mốc son sự nghiệp, bảng thông số kỹ thuật, quy chuẩn tiếp đón thăm xưởng và danh sách tác phẩm tiêu biểu (quan hệ N-N).
      parameters:
        - name: id
          in: path
          required: true
          description: "ID số, slug hoặc mã REF của nghệ nhân (Ví dụ: 1 hoặc ART-BT-001)"
          schema:
            type: string
            example: ART-BT-001
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ArtisanDetail'
        '404':
          $ref: '#/components/responses/404Error'

    put:
      tags:
        - Artisans
        - Admin Management (Optional)
      summary: "[Admin/Editor] Cập nhật hồ sơ nghệ nhân"
      description: >-
        > ⚠️ **Mục 6.3 Tuỳ chọn (chưa có giao diện, làm sau cùng):** Cập nhật thông tin nghệ nhân, tiểu sử, thông số kỹ thuật, thời gian đặt trước và giờ mở xưởng.
        Yêu cầu Bearer Token với vai trò `editor` hoặc `admin`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID số hoặc mã REF của nghệ nhân
          schema:
            type: string
            example: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArtisanRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
