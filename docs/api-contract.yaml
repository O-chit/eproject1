  # ==========================================
  # VISIT BOOKINGS ENDPOINTS
  # ==========================================
  /visit-bookings:
    post:
      tags:
        - Bookings
      summary: Đăng ký đặt lịch hẹn đàm đạo trà & thăm xưởng nghệ nhân
      description: Ràng buộc ngày hẹn phải trước ít nhất 24h hoặc 48h tùy theo nghệ nhân (visit_lead_time_hours), ngày hẹn thuộc các ngày mở cửa (visit_open_days), số khách không vượt quá sức chứa (visit_max_guests).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitBookingRequest'
      responses:
        '201':
          description: Đăng ký thành công, tạo phiếu hẹn trạng thái pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitBookingResponse'
        '400':
          $ref: '#/components/responses/400Error'

    get:
      tags:
        - Bookings
      summary: Lấy danh sách phiếu hẹn thăm xưởng
      description: >-
        Lấy danh sách phiếu hẹn thăm xưởng. Đối với người dùng thông thường (`user`), chỉ trả về các phiếu hẹn do tài khoản đó tạo.
        Đối với `editor` hoặc `admin`, có thể xem toàn bộ phiếu hẹn trên toàn hệ thống khi truyền tham số `all=true`, kèm bộ lọc theo nghệ nhân và trạng thái.
      security:
        - BearerAuth: []
      parameters:
        - name: all
          in: query
          description: "[Admin/Editor] Xem tất cả phiếu hẹn toàn hệ thống (mặc định false - chỉ xem của mình)"
          schema:
            type: boolean
            default: false
        - name: artisanId
          in: query
          description: "[Admin/Editor] Lọc theo ID nghệ nhân"
          schema:
            type: integer
            example: 1
        - name: status
          in: query
          description: Lọc theo trạng thái phiếu hẹn
          schema:
            type: string
            enum: [all, pending, confirmed, cancelled, completed]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VisitBookingItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'

  /visit-bookings/{id}/status:
    patch:
      tags:
        - Bookings
        - Admin Management (Optional)
      summary: "[Admin/Editor] Cập nhật trạng thái phiếu hẹn thăm xưởng"
      description: >-
        > ⚠️ **Mục 6.3 Tuỳ chọn (chưa có giao diện, làm sau cùng):** Cho phép editor hoặc admin xác nhận (`confirmed`), hủy (`cancelled`) hoặc hoàn tất (`completed`) phiếu hẹn thăm xưởng của khách.
        Yêu cầu Bearer Token với vai trò `editor` hoặc `admin`. Chỉ thực hiện sau khi giai đoạn 1–6 xong và test xanh.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
