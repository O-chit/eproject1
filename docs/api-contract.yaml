              schema:
                $ref: '#/components/schemas/AdminContactMessagesResponse'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'

  /contact/messages/{id}/status:
    patch:
      tags:
        - Contact
        - Admin Management (Optional)
      summary: "[Admin/Editor] Đổi trạng thái tin nhắn liên hệ"
      description: >-
        > ⚠️ **Mục 6.3 Tuỳ chọn (chưa có giao diện, làm sau cùng):** Cập nhật trạng thái xử lý tin nhắn liên hệ (`unread`, `read`, `replied`) kèm ghi chú xử lý nội bộ.
        Yêu cầu Bearer Token với vai trò `editor` hoặc `admin`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID của tin nhắn liên hệ
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactMessageStatusRequest'
      responses:
        '200':
          description: Đổi trạng thái tin nhắn thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cập nhật trạng thái tin nhắn thành công
                  data:
                    $ref: '#/components/schemas/AdminContactMessageItem'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'

# ==========================================
# COMPONENTS (SCHEMAS & RESPONSES)
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mã thông báo xác thực JWT được cấp sau khi đăng nhập thành công.

  responses:
    400Error:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    401Error:
      description: Chưa xác thực hoặc Token đã hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    403Error:
      description: Quyền truy cập bị từ chối (yêu cầu vai trò editor hoặc admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    404Error:
      description: Không tìm thấy tài nguyên yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thực hiện thành công

    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Lỗi kiểm tra dữ liệu đầu vào
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              issue:
                type: string
                example: Email không hợp lệ

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 12
        totalItems:
          type: integer
          example: 48
        totalPages:
          type: integer
          example: 4

    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          example: Nguyễn Văn An
        email:
          type: string
          format: email
          example: an.nguyen@example.com
        password:
          type: string
          minLength: 8
          example: CraftRoots@2026

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: an.nguyen@example.com
        password:
          type: string
          example: CraftRoots@2026

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Nguyễn Văn An
        email:
          type: string
          example: an.nguyen@example.com
        role:
          type: string
          enum: [user, admin, editor]
