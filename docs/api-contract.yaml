# ==========================================
# COMPONENTS (SCHEMAS & RESPONSES)
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mã thông báo xác thực JWT được cấp sau khi đăng nhập thành công.

  responses:
    400Error:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    401Error:
      description: Chưa xác thực hoặc Token đã hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    404Error:
      description: Không tìm thấy tài nguyên yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thực hiện thành công

    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Lỗi kiểm tra dữ liệu đầu vào
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              issue:
                type: string
                example: Email không hợp lệ

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 12
        totalItems:
          type: integer
          example: 48
        totalPages:
          type: integer
          example: 4

    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          example: Nguyễn Văn An
        email:
          type: string
          format: email
          example: an.nguyen@example.com
        password:
          type: string
          minLength: 8
          example: CraftRoots@2026

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: an.nguyen@example.com
        password:
          type: string
          example: CraftRoots@2026

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Nguyễn Văn An
        email:
          type: string
          example: an.nguyen@example.com
        role:
          type: string
          enum: [user, admin, editor]
          example: user
        avatarUrl:
          type: string
          nullable: true
          example: https://craftroots.vn/avatars/user1.jpg

    UserProfileUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyễn Văn An
        avatarUrl:
          type: string
          example: https://craftroots.vn/avatars/user1.jpg

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          example: CraftRoots@2026
        newPassword:
          type: string
          minLength: 8
          example: CraftRoots@New2027

    HomeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            spotlightCraft:
              $ref: '#/components/schemas/CraftDetail'
            stats:
              $ref: '#/components/schemas/StatsResponseData'
            featuredCrafts:
              type: array
              items:
                $ref: '#/components/schemas/CraftSummary'
            featuredArtisans:
              type: array
              items:
                $ref: '#/components/schemas/ArtisanProfile'
            latestSeasonal:
              $ref: '#/components/schemas/SeasonalCollectionDetail'
            fieldNote:
              $ref: '#/components/schemas/FieldNoteItem'

    StatsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/StatsResponseData'

    StatsResponseData:
      type: object
      properties:
        totalCrafts:
          type: integer
          example: 48
        totalArtisans:
          type: integer
          example: 24
        totalVillages:
          type: integer
          example: 32
        nationalHeritages:
          type: integer
          example: 12

    SearchResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            crafts:
              type: array
              items:
                $ref: '#/components/schemas/CraftSummary'
            artisans:
              type: array
              items:
                $ref: '#/components/schemas/ArtisanProfile'
            villages:
              type: array
              items:
                $ref: '#/components/schemas/VillageSummary'
            totalResults:
              type: integer
              example: 15

    CraftFacets:
      type: object
